[package]
name = "edge-purge-sync"
version = "0.1.0"
edition = "2021"
description = "Autonomous Cloudflare/CDN cache synchronizer: diffs built asset hashes against edge headers, triggers granular Cache API purges"
license = "MIT"
readme = "README.md"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
